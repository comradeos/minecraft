services:
  minecraft:
    image: ${SERVER_IMAGE:-itzg/minecraft-server:latest}
    container_name: ${CONTAINER_NAME:-minecraft}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${SERVER_PORT:-25565}:25565"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      EULA: ${EULA:-TRUE}
      TYPE: ${SERVER_TYPE:-VANILLA}
      VERSION: ${MC_VERSION:-26.2}
      MEMORY: ${MEMORY:-4G}
      MOTD: ${MOTD:-Minecraft Server}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      DIFFICULTY: ${DIFFICULTY:-normal}
      MODE: ${GAMEMODE:-survival}
      PVP: ${PVP:-TRUE}
      ENABLE_WHITELIST: ${ENABLE_WHITELIST:-FALSE}
      ALLOW_NETHER: ${ALLOW_NETHER:-TRUE}
      SPAWN_PROTECTION: ${SPAWN_PROTECTION:-16}
      TZ: ${TZ:-UTC}
      FORGE_VERSION: ${FORGE_VERSION:-}
      NEOFORGE_VERSION: ${NEOFORGE_VERSION:-}
      FABRIC_LOADER_VERSION: ${FABRIC_LOADER_VERSION:-}
      QUILT_LOADER_VERSION: ${QUILT_LOADER_VERSION:-}
      PAPER_CHANNEL: ${PAPER_CHANNEL:-}
